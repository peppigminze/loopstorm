<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LOOPSTORM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23120c1c'/%3E%3Cpath d='M6 30 C 2 10, 30 2, 32 18 S 14 34, 20 20 S 36 8, 38 6' fill='none' stroke='%238ff6ff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#120c1c;--panel:rgba(18,12,28,.78);--line:rgba(255,255,255,.12);--txt:#ece8ff;--mut:#a59fbf;--gold:#ffd66b;--shard:#7ffff3;--za:#ffb36b;
  --f:"Avenir Next","Segoe UI","Trebuchet MS",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--f);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:800;letter-spacing:.3em;color:#8ff6ff}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:.55em .8em;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (hover:hover){button:not(:disabled):hover{background:rgba(255,255,255,.12)}}
h2{font-size:.82rem;font-weight:700;color:var(--mut);margin:1.4em 0 .6em;letter-spacing:.04em}
h2 small{font-weight:500;margin-left:.5em}
.hint{color:var(--mut);font-size:.85rem}

/* ---------- Menü ---------- */
.menu{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(18,12,28,.35),rgba(18,12,28,.88) 45%);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.8rem 1rem .4rem;max-width:820px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:.45rem;font-weight:900;font-style:italic;font-size:1.35rem;letter-spacing:.14em;color:#fff}
.brand svg{width:34px;height:34px;color:#8ff6ff;filter:drop-shadow(0 0 6px #8ff6ff88)}
.wallet{display:flex;gap:.7rem;align-items:center;font-weight:800;font-size:.95rem}
.dust{color:var(--gold)}.shard{color:var(--shard)}
.lvl{position:relative;padding:.15em .5em .3em;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.82rem}
.lvl i{position:absolute;left:0;bottom:0;height:3px;background:#8fffc8}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 1rem 1rem;max-width:820px;width:100%;margin:0 auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;max-width:820px;width:100%;margin:0 auto;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));gap:.3rem;background:rgba(10,7,16,.9);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;font-size:.8rem;font-weight:700;color:var(--mut);padding:.75em .2em;border-radius:8px}
.tabs button.on{color:#fff;background:rgba(255,255,255,.1)}

.zones{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.4rem;touch-action:pan-x}
.zone{flex:0 0 min(78%,250px);scroll-snap-align:start;border-radius:14px;padding:.85rem;background:radial-gradient(120% 90% at 100% 0%,var(--zc),var(--zb));border:1px solid var(--line);cursor:pointer;position:relative}
.zone.sel{border-color:var(--za);box-shadow:0 0 0 1px var(--za),0 0 24px -6px var(--za)}
.zone.locked{filter:grayscale(.8);opacity:.55;cursor:default}
.zn small{display:block;color:var(--za);font-weight:700;font-size:.72rem}
.zn b{font-size:1.15rem}
.zone p{font-size:.8rem;color:#cfc8e8;margin:.4em 0 .7em;min-height:2.4em}
.zi{display:flex;gap:.35rem}
.pill{padding:.3em .7em;font-weight:800;font-size:.8rem;border-radius:20px}
.pill.on{background:var(--za);color:#120c1c;border-color:var(--za)}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cls{text-align:left;display:flex;flex-direction:column;gap:.3em;padding:.7rem;border-left:4px solid var(--cc)}
.cls b{color:var(--cc)}.cls span{font-size:.72rem;color:var(--mut);line-height:1.3}
.cls.sel{background:rgba(255,255,255,.12);border-color:var(--cc)}
@media (max-width:520px){.classes{grid-template-columns:1fr}.cls span{font-size:.75rem}}
.goal{margin:.45rem 0}
.gl{display:flex;justify-content:space-between;gap:.5rem;font-size:.85rem}
.gl b{color:var(--mut);font-weight:700;white-space:nowrap}
.goal.main .gl span{color:#ffe9a8}
.gbar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:.25rem}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#8ff6ff,#ffd66b);border-radius:3px}
.start{display:block;width:100%;margin:1.3rem 0 .4rem;padding:1rem;font-size:1.25rem;font-weight:900;font-style:italic;letter-spacing:.06em;color:#120c1c;background:var(--za);border:0;border-radius:14px;box-shadow:0 6px 30px -8px var(--za);animation:breathe 2.4s ease-in-out infinite}
.start small{display:block;font-size:.65rem;font-style:normal;letter-spacing:0;opacity:.6;font-weight:700}
@keyframes breathe{50%{transform:scale(1.015)}}
@media (prefers-reduced-motion:reduce){.start{animation:none}}

.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.branch h3{margin:0 0 .5rem;color:var(--bc);font-size:.95rem;text-align:center}
.srow{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.4rem;position:relative}
.srow+.srow:before{content:"";position:absolute;top:-.45rem;left:50%;width:2px;height:.4rem;background:var(--line)}
.node{display:grid;grid-template-columns:1fr auto;gap:.1em .3em;text-align:left;padding:.5rem .55rem;font-size:.78rem;border-color:rgba(255,255,255,.1)}
.node b{grid-column:1/-1;font-size:.8rem}.node span{color:var(--mut)}.node em{font-style:normal;color:var(--gold);font-weight:700;text-align:right}
.node.can{border-color:var(--bc);box-shadow:inset 0 0 0 1px var(--bc)}
.node.max{background:color-mix(in srgb,var(--bc) 18%,transparent)}.node.max em{color:var(--bc)}
.node.locked{opacity:.4}.node.sel{outline:2px solid #fff}
.sdetail{position:sticky;bottom:0;margin-top:.8rem;display:flex;gap:.7rem;align-items:center;justify-content:space-between;padding:.8rem;background:rgba(10,7,16,.95);border:1px solid var(--line);border-radius:12px}
.sdetail p{margin:.2em 0 0;font-size:.82rem;color:var(--mut)}
.buy{background:var(--gold);color:#120c1c;font-weight:800;border:0;white-space:nowrap}
.buy:disabled{background:rgba(255,255,255,.08);color:var(--mut)}

.equipped{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.item{position:relative;text-align:left;display:flex;flex-direction:column;gap:.15em;padding:.6rem;border-left:4px solid var(--rc,#555);min-height:4.6rem}
.item .slot{font-size:.65rem;color:var(--mut);font-weight:700}
.item b{font-size:.8rem;color:var(--rc)}.item small{font-size:.68rem;color:var(--mut)}
.item.empty{border:1px dashed var(--line);border-radius:10px}
.item .eq{position:absolute;top:.4rem;right:.5rem;color:#7dff8a;font-style:normal}
.item .nw{position:absolute;top:.35rem;right:.5rem;font-size:.6rem;font-style:normal;background:#ff4d6d;color:#fff;padding:0 .35em;border-radius:6px}
.item.sel{outline:2px solid #fff}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.45rem}
.invh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.invh div{display:flex;gap:.4rem}.invh button{font-size:.75rem}
.idetail{margin-top:.7rem;padding:.8rem;border:1px solid var(--rc);border-radius:12px;background:rgba(10,7,16,.92)}
.ih b{color:var(--rc);font-size:1rem}.ih small{display:block;color:var(--mut);font-size:.75rem}
.idetail ul{margin:.5rem 0;padding-left:1.1rem;font-size:.85rem}
.idetail li.imp{color:#fff;font-weight:700}.idetail li.uniq{color:#ffa53d;font-weight:700;list-style:"★ "}
.cmp{font-size:.8rem;margin:.3rem 0}.cmp.up{color:#7dff8a}.cmp.down{color:#ff8080}
.ibtn{display:flex;gap:.4rem;flex-wrap:wrap}.ibtn button{font-size:.8rem}
.stats{margin-top:1rem;border:1px solid var(--line);border-radius:12px;padding:.5rem .8rem}
.stats summary{cursor:pointer;font-weight:700;font-size:.85rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.3rem .9rem;margin:.6rem 0}
.sgrid div{display:flex;justify-content:space-between;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.05);padding:.2em 0}
.sgrid span{color:var(--mut)}
.flags{display:flex;flex-wrap:wrap;gap:.3rem}.flags em,.pperks em{font-style:normal;font-size:.72rem;padding:.15em .5em;border-radius:6px;background:rgba(255,165,61,.15);color:#ffa53d}
.pperks em.syn{background:rgba(127,255,243,.15);color:#7ffff3}

.mcard{position:relative;padding:.75rem;border:1px solid var(--line);border-radius:12px;margin-bottom:.5rem;background:rgba(255,255,255,.03)}
.mcard.main{border-color:#ffe9a8;background:rgba(255,233,168,.06)}
.mcard.daily{border-color:rgba(127,255,243,.4)}
.mcard.done{opacity:.5}
.mcard b{font-size:.92rem}.mcard p{margin:.2em 0 .5em;font-size:.82rem;color:var(--mut)}
.mcard small{font-size:.72rem;color:var(--mut)}
.mr{position:absolute;top:.75rem;right:.8rem;font-weight:800;font-size:.82rem;color:var(--gold)}
.mss{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
.ms{font-size:.82rem}.ms span{float:right;color:var(--mut)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.4rem}
.ach{padding:.5rem;border:1px solid var(--line);border-radius:10px;opacity:.4;font-size:.78rem}
.ach small{display:block;color:var(--mut);font-size:.68rem}
.ach.got{opacity:1;border-color:var(--gold);background:rgba(255,214,107,.07)}.ach.got b{color:var(--gold)}
.howto p{font-size:.85rem;line-height:1.45;margin:.4em 0;color:#d4cfe8}
.sets{display:flex;flex-direction:column;gap:.5rem}
.tog{display:flex;align-items:center;gap:.6rem;font-size:.9rem;cursor:pointer}
.tog input{width:1.15rem;height:1.15rem;accent-color:#8ff6ff}
.danger{border-color:#ff4d6d;color:#ff8da0}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,5,14,.62);padding:1rem;z-index:5;overflow-y:auto;touch-action:pan-y}
.modal{width:min(560px,100%);background:rgba(18,12,28,.96);border:1px solid var(--line);border-radius:18px;padding:1.2rem;animation:pop .22s cubic-bezier(.2,1.4,.4,1);max-height:calc(100vh - 2rem);overflow-y:auto}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.modal h1{margin:0 0 .3rem;font-size:1.7rem;font-weight:900;font-style:italic;letter-spacing:.04em;text-align:center}
.modal>p{text-align:center;color:var(--mut);margin:.2rem 0 .8rem}
.perks{display:grid;gap:.6rem}
.perk{position:relative;display:flex;flex-direction:column;text-align:left;gap:.2em;padding:.85rem .9rem .85rem 2.8rem;border-color:rgba(143,246,255,.35)}
.perk kbd{position:absolute;left:.8rem;top:.85rem;font:800 .85rem var(--f);color:#8ff6ff;border:1px solid #8ff6ff66;border-radius:5px;padding:0 .35em}
.perk b{font-size:1.02rem}.perk span{color:#d4cfe8;font-size:.86rem}.perk small{color:var(--mut);font-size:.72rem}
.perk em{font-style:normal;color:#7ffff3;font-weight:800;font-size:.8rem}
.primary{display:block;width:100%;padding:.9rem;font-size:1.1rem;font-weight:900;background:#8ff6ff;color:#120c1c;border:0;margin:.8rem 0}
.primary small{font-size:.65rem;opacity:.6;margin-left:.5em}
.pstats{display:flex;flex-wrap:wrap;gap:.4rem .9rem;justify-content:center;color:var(--mut);font-size:.85rem}
.pperks{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin:.7rem 0}
.pause .sets{flex-direction:row;justify-content:center;flex-wrap:wrap;gap:1rem;margin-bottom:1rem}
.pause .danger{width:100%}
.odbtns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.odbtns button{display:flex;flex-direction:column;gap:.35em;padding:1rem;text-align:left;position:relative}
.odbtns b{font-size:1.15rem}.odbtns span{font-size:.8rem;color:#d4cfe8}
.odbtns small{position:absolute;top:.6rem;right:.7rem;color:var(--mut)}
.odbtns .go{border-color:#ff4d6d;background:rgba(255,77,109,.14)}.odbtns .go b{color:#ff4d6d}
.odbtns .bank b{color:#7dff8a}
@media (max-width:420px){.odbtns{grid-template-columns:1fr}}
.res.win h1{color:#ffd66b}.res.lose h1{color:#ff8da0}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.8rem 0}
.rgrid div{background:rgba(255,255,255,.04);border-radius:10px;padding:.45rem;text-align:center}
.rgrid span{display:block;font-size:.66rem;color:var(--mut)}.rgrid b{font-size:1.05rem}
@media (max-width:420px){.rgrid{grid-template-columns:repeat(2,1fr)}}
.lvup{text-align:center;color:#8fffc8;font-weight:900;font-size:1.1rem}
.loots{display:flex;flex-wrap:wrap;gap:.4rem}
.loot{border:1px solid var(--rc);border-radius:10px;padding:.4rem .6rem;animation:lootin .45s backwards cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 16px -6px var(--rc)}
.loot b{display:block;color:var(--rc);font-size:.82rem}.loot small{color:var(--mut);font-size:.68rem}
@keyframes lootin{from{transform:translateY(12px) scale(.7);opacity:0}}
.rew{list-style:none;padding:0;margin:.3rem 0;font-size:.85rem}
.rew li{display:flex;justify-content:space-between;padding:.25em 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rew li span{color:var(--gold);font-weight:700}
.rew li.unl{color:#7ffff3;font-weight:800}
.rbtn{display:grid;grid-template-columns:2fr 1fr;gap:.5rem;align-items:center}
.rbtn .primary{margin:.6rem 0 0}.rbtn button:last-child{margin-top:.6rem;padding:.9rem}
.off .big{font-size:2rem;font-weight:900;color:var(--gold);text-align:center;margin:.5rem 0}
#toasts{position:fixed;top:calc(4rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.35rem;z-index:9;pointer-events:none;width:min(420px,92vw)}
.toast{background:rgba(18,12,28,.95);border:1px solid #fff;border-radius:10px;padding:.5rem .8rem;font-size:.85rem;font-weight:700;animation:pop .2s;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-8px)}
body.playing #toasts{top:auto;bottom:6rem}
.wallet span{white-space:nowrap}
.item .eq{top:auto;bottom:.4rem}
@media (max-width:440px){.brand{font-size:1.02rem;letter-spacing:.08em}.brand svg{width:26px;height:26px}.wallet{gap:.45rem;font-size:.85rem}.top{padding:.7rem .7rem .3rem}.body{padding:0 .7rem 1rem}}
@media (hover:none){.start small,.primary small,.perk kbd,.odbtns small{display:none}.perk{padding-left:.9rem}}
</style>
</head>

const __m_logic_content_js = (function () {
// Bereitet Rohdaten (JSON) für schnellen Zugriff auf
const DATA_FILES = ['classes', 'zones', 'enemies', 'bosses', 'perks', 'items', 'skills', 'missions', 'achievements', 'events'];

function prepareData(raw) {
  const d = Object.assign({}, raw);
  const map = (arr) => { const m = {}; for (const x of arr) m[x.id] = x; return m; };
  d.classMap = map(d.classes);
  d.zoneMap = map(d.zones);
  d.enemyMap = map(d.enemies);
  d.bossMap = map(d.bosses);
  d.perkList = d.perks.perks;
  d.synergies = d.perks.synergies;
  d.perkMap = map(d.perkList);
  d.skillNodes = d.skills.nodes;
  d.skillMap = map(d.skillNodes);
  d.baseMap = map(d.items.bases);
  d.eventMap = map(d.events);
  for (const z of d.zones) {
    for (const e of z.enemies) {
      if (!d.enemyMap[e.id]) throw new Error('Unbekannter Gegner ' + e.id + ' in ' + z.id);
      e.def = d.enemyMap[e.id];
    }
    if (!d.bossMap[z.boss]) throw new Error('Unbekannter Boss ' + z.boss);
  }
  for (const b of d.bosses) for (const p of b.patterns) if (p.enemy && !d.enemyMap[p.enemy]) throw new Error('Boss-Add fehlt ' + p.enemy);
  return d;
}

return { DATA_FILES, prepareData };
})();

    life: { kills: 0, loops: 0, elites: 0, bosses: 0, dust: 0, runs: 0, time: 0, perks: 0, odClears: 0, synergies: 0, goldKills: 0,
      events: 0, noHitBoss: 0, revives: 0, bestCatch: 0, bestCombo: 0, deaths: 0, wins: 0, items: 0 },
    main: null, mainIdx: 0, side: [], daily: null, ms: {}, ach: {},
    settings: { sound: true, music: true, shake: true, quality: 'hoch', demo: true },
    tutorialDone: false, lastSeen: now, created: now, newItems: 0
  };
}

function fill(def, src) {
  if (src === null || typeof src !== 'object' || Array.isArray(src)) return def;
  const out = {};
  for (const k in def) {
    const d = def[k], s = src[k];
    if (d === null) out[k] = (s === undefined) ? null : s;
    else if (Array.isArray(d)) out[k] = Array.isArray(s) ? s : d;
    else if (typeof d === 'object') out[k] = (s && typeof s === 'object' && !Array.isArray(s)) ? (Object.keys(d).length ? fill(d, s) : s) : d;
    else if (typeof d === 'number') out[k] = (typeof s === 'number' && isFinite(s)) ? s : d;
    else if (typeof d === 'boolean') out[k] = typeof s === 'boolean' ? s : d;
    else out[k] = typeof s === typeof d ? s : d;

}

function sanitizeSave(raw, data) {

const __m_logic_rng_js = (function () {
// Deterministischer Zufall (mulberry32) + Helfer
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  return h >>> 0;
}

  let sum = 0;
  for (let i = 0; i < list.length; i++) sum += list[i][key];
  let r = rng() * sum;
  for (let i = 0; i < list.length; i++) { r -= list[i][key]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}
function range(rng, a, b) { return a + (b - a) * rng(); }
function shuffle(rng, arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

    if (st.flags.shock) shockwave(w, f.cx, f.cy, st.flags.bigShock ? 260 : 150, st.loopDmg * 0.5);
    if (st.flags.sparkLoop) {
      const k = st.flags.starfire ? 16 : 8;
      for (let i = 0; i < k; i++) fireSpark(w, f.cx, f.cy, i / k * 6.283, st.sparkDmg * 1.2);
    }
  }
}

function distToPolyCenter(f, e) {
  // Boss gilt als gefangen, wenn sein Zentrum knapp ausserhalb, aber die Schleife ihn grösstenteils umschliesst
  const dx = e.x - f.cx, dy = e.y - f.cy;
  return dx * dx + dy * dy < (e.r * 0.6) ** 2;
}

function cutTailAt(w, idx) {
  // entfernt alles bis einschliesslich idx (älterer Teil)
  const k = idx + 1;
  if (k >= w.tLen) return;
  w.tStart = tailIdx(w, k); w.tLen -= k;
}

// ---------- Spieler ----------
function updatePlayer(w, dt, input) {
  const p = w.p, st = w.stats;
  let mx = input.mx || 0, my = input.my || 0;
  const m = Math.hypot(mx, my);
  if (m > 1) { mx /= m; my /= m; }
  let spd = st.speed * (p.dashT > 0 ? 2.4 : 1);
  const tvx = mx * spd, tvy = my * spd;
  const k = Math.min(1, dt * (m > 0.05 ? 9 : 5));
  p.vx += (tvx - p.vx) * k + p.pullX * dt; p.vy += (tvy - p.vy) * k + p.pullY * dt;
  p.pullX = 0; p.pullY = 0;
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (p.x < PR) { p.x = PR; p.vx = Math.abs(p.vx) * 0.3; } if (p.x > ARENA_W - PR) { p.x = ARENA_W - PR; p.vx = -Math.abs(p.vx) * 0.3; }
  if (p.y < PR) { p.y = PR; p.vy = Math.abs(p.vy) * 0.3; } if (p.y > ARENA_H - PR) { p.y = ARENA_H - PR; p.vy = -Math.abs(p.vy) * 0.3; }
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 20) { p.dirX = p.vx / sp; p.dirY = p.vy / sp; }
  if (p.inv > 0) p.inv -= dt;
  if (p.dashT > 0) p.dashT -= dt;
  if (p.netT > 0) p.netT -= dt;
  if (p.scd > 0) p.scd -= dt;
  if (st.regen > 0 && p.hp < st.maxHp) p.hp = Math.min(st.maxHp, p.hp + st.regen * dt);
  // Schweif
  const li = tailIdx(w, w.tLen - 1);
  const dx = p.x - w.tx[li], dy = p.y - w.ty[li];
  const d2 = dx * dx + dy * dy;
  if (d2 >= SPACING * SPACING) {
    const d = Math.sqrt(d2);
    if (d > SPACING * 3) { // Teleport/Knockback: Schweif nicht verbinden
      w.tStart = 0; w.tLen = 1; w.tx[0] = p.x; w.ty[0] = p.y;
    } else addTailPoint(w, p.x, p.y);
  }
  // Spezial
  if (input.special && p.scd <= 0) useSpecial(w);
}

function useSpecial(w) {
  const p = w.p, st = w.stats;
  p.scd = st.specialCd;
  if (st.special === 'dash') { p.dashT = 0.32; p.inv = Math.max(p.inv, 0.42); }
  else if (st.special === 'net') { p.netT = 3; }
  else if (st.special === 'nova') {
    for (let i = 0; i < 16; i++) fireSpark(w, p.x, p.y, i / 16 * 6.283, st.sparkDmg * 1.5);
    shockwave(w, p.x, p.y, 190, st.loopDmg * 1.1);
  }
  emit(w, EV.SPECIAL, p.x, p.y, 0, st.special === 'dash' ? 0 : st.special === 'net' ? 1 : 2);
}

// ---------- Gegner-KI ----------
function steer(e, tx, ty, spd, dt, k = 3) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
  const f = Math.min(1, dt * k);
  e.vx += (dx / d * spd - e.vx) * f; e.vy += (dy / d * spd - e.vy) * f;
}

function updateEnemies(w, dt) {
  const p = w.p, rng = w.rng;
  const tailTick = (w.tailTick -= dt) <= 0;
  if (tailTick) w.tailTick = 0.1;
  for (let i = 0; i < w.enemies.length; i++) {
    const e = w.enemies[i];
    if (!e.on) continue;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.burnT > 0) {
      e.burnT -= dt;
      e.burnAcc = (e.burnAcc || 0) + dt;
      if (e.burnAcc >= 0.5) { e.burnAcc = 0; damageEnemy(w, e, e.burnD * 0.5, 3, false); if (!e.on) continue; }
    }
    let sf = 1;
    if (e.freezeT > 0) { e.freezeT -= dt; sf = 0; } else if (e.slowT > 0) { e.slowT -= dt; sf = 1 - Math.max(0.5, w.stats.loopSlow); }
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    const def = e.def;
    if (e.boss) bossAI(w, e, dt, dx, dy, d, sf);
    else switch (def.ai) {
      case 'chase': case 'splitter': steer(e, p.x, p.y, e.spd, dt); break;
      case 'swarm': {
        const j = Math.sin(e.t * 5 + e.ang) * 0.7;
        steer(e, p.x - dy / d * j * 80, p.y + dx / d * j * 80, e.spd, dt, 4); break;
      }
      case 'dart':
        if (e.state === 0) { steer(e, p.x, p.y, e.spd, dt); e.cd -= dt; if (e.cd <= 0 && d < 380) { e.state = 1; e.cd2 = 0.55; e.ang = Math.atan2(dy, dx); } }
        else if (e.state === 1) { e.vx *= 0.85; e.vy *= 0.85; e.cd2 -= dt; if (e.cd2 <= 0) { e.state = 2; e.cd2 = 0.55; e.vx = Math.cos(e.ang) * e.spd * 6; e.vy = Math.sin(e.ang) * e.spd * 6; } }
        else { e.cd2 -= dt; if (e.cd2 <= 0) { e.state = 0; e.cd = 2.2 + rng(); } }
        break;
      case 'shooter': {
        const want = d > 360 ? 1 : d < 270 ? -1 : 0;
        steer(e, e.x + dx / d * want * 100 - dy / d * 60, e.y + dy / d * want * 100 + dx / d * 60, e.spd, dt);
        e.cd -= dt;
        if (e.cd <= 0 && d < 600) { e.cd = 2.3 + rng() * 0.6; fireBullet(w, e.x, e.y, Math.atan2(dy, dx), 220, e.dmg * 0.8); emit(w, EV.SHOOT, e.x, e.y); }
        break;
      }
      case 'orbit': {
        e.tx = Math.max(90, e.tx - dt * 14);
        const a = Math.atan2(-dy, -dx) + dt * e.spd / e.tx;
        steer(e, p.x + Math.cos(a + 0.35) * e.tx, p.y + Math.sin(a + 0.35) * e.tx, e.spd, dt, 4);
        break;
      }
      case 'mine':
        e.vx *= 0.9; e.vy *= 0.9;
        if (e.state === 0 && d < 115) { e.state = 1; e.cd2 = 0.75; }
        if (e.state === 1) {
          e.cd2 -= dt;
          if (e.cd2 <= 0) {
            emit(w, EV.EXPLODE, e.x, e.y, 120);
            if (d < 120 + PR) hurtPlayer(w, e.dmg, e.x, e.y);
            for (let k = 0; k < 10; k++) fireBullet(w, e.x, e.y, k * 0.628, 150, e.dmg * 0.5);
            e.on = false; w.alive--; continue;
          }
        }
        break;
      case 'leech': {
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = 0.3;
          let bi = -1, bd = 1e12;
          for (let k = 0; k < w.tLen - 3; k += 2) { const q = tailIdx(w, k); const dd = (w.tx[q] - e.x) ** 2 + (w.ty[q] - e.y) ** 2; if (dd < bd) { bd = dd; bi = k; } }
          if (bi >= 0 && bd < 400 * 400) { const q = tailIdx(w, bi); e.tx = w.tx[q]; e.ty = w.ty[q]; e.state = 1; } else e.state = 0;
        }
        if (e.state === 1) {
          steer(e, e.tx, e.ty, e.spd * 1.15, dt, 5);
          // Schweif anfressen
          for (let k = 0; k < w.tLen - 3; k++) {
            const q = tailIdx(w, k);
            if ((w.tx[q] - e.x) ** 2 + (w.ty[q] - e.y) ** 2 < (e.r + 5) ** 2) { emit(w, EV.CUT, w.tx[q], w.ty[q]); cutTailAt(w, k); e.state = 0; e.cd = 1.2; break; }
          }
        } else steer(e, p.x, p.y, e.spd, dt);
        break;
      }
      case 'blink':
        steer(e, p.x, p.y, e.spd, dt); e.cd -= dt;
        if (e.cd <= 0 && d < 700) {
          e.cd = 3 + rng() * 2;
          emit(w, EV.TELE, e.x, e.y);
          const a = rng() * 6.283; e.x = Math.max(20, Math.min(ARENA_W - 20, p.x + Math.cos(a) * 190)); e.y = Math.max(20, Math.min(ARENA_H - 20, p.y + Math.sin(a) * 190));
          e.vx = 0; e.vy = 0; emit(w, EV.TELE, e.x, e.y);
        }
        break;
      case 'spawner':
        steer(e, p.x, p.y, e.spd, dt); e.cd -= dt;
        if (e.cd <= 0 && d < 750) { e.cd = 4.2; for (let k = 0; k < 3; k++) spawnEnemy(w, w.data.enemyMap.mite, e.x + (k - 1) * 14, e.y + 10, false); }
        break;
      case 'healer': {
        e.cd -= dt;
        steer(e, p.x + (e.tx - 280) * 2, p.y, e.spd, dt);
        if (d < 250) steer(e, e.x - dx, e.y - dy, e.spd, dt);
        if (e.cd <= 0) {
          e.cd = 2.2; emit(w, EV.HEAL, e.x, e.y, 0, 1);
          for (let k = 0; k < w.enemies.length; k++) {
            const o = w.enemies[k];
            if (o.on && !o.boss && o !== e && (o.x - e.x) ** 2 + (o.y - e.y) ** 2 < 150 * 150) o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.2);
          }
        }
        break;
      }
      case 'bomber': steer(e, p.x, p.y, e.spd, dt); break;
      case 'sniper':
        if (e.state === 0) {
          const want = d > 560 ? 1 : d < 420 ? -1 : 0;
          steer(e, e.x + dx / d * want * 100, e.y + dy / d * want * 100, e.spd, dt);
          e.cd -= dt; if (e.cd <= 0 && d < 750) { e.state = 1; e.cd2 = 1.0; }
        } else {
          e.vx *= 0.8; e.vy *= 0.8; e.ang = Math.atan2(dy, dx); e.cd2 -= dt;
          if (e.cd2 <= 0) { e.state = 0; e.cd = 3.5 + rng(); fireBullet(w, e.x, e.y, e.ang, 560, e.dmg, true); emit(w, EV.SHOOT, e.x, e.y, 1); }
        }
        break;
      case 'magnet':
        steer(e, p.x, p.y, e.spd, dt);
        if (d < 430) { p.pullX += -dx / d * 140; p.pullY += -dy / d * 140; }
        break;
      case 'phantom':
        steer(e, p.x, p.y, e.spd, dt);
        e.alpha = Math.max(0.12, Math.min(1, 1.25 - d / 380));
        break;
      case 'turret':
        e.vx *= 0.9; e.vy *= 0.9; e.cd -= dt;
        if (d < 680 && e.cd <= 0) {
          e.cd = 0.32; e.ang += 0.42; e.state++;
          fireBullet(w, e.x, e.y, e.ang, 160, e.dmg * 0.7);
          if (e.state % 14 === 0) e.cd = 2.2;
        }
        break;
      case 'kamikaze': steer(e, p.x, p.y, e.spd, dt, 2); break;
      case 'gold': {
        steer(e, e.x - dx, e.y - dy, e.spd * (d < 300 ? 1 : 0.6), dt, 2);
        if (e.x < 60 || e.x > ARENA_W - 60) e.vx += (ARENA_W / 2 - e.x) * dt * 3;
        if (e.y < 60 || e.y > ARENA_H - 60) e.vy += (ARENA_H / 2 - e.y) * dt * 3;
        if (e.t > 14) { emit(w, EV.GOLDESC, e.x, e.y); e.on = false; w.alive--; continue; }
        break;
      }
      default: steer(e, p.x, p.y, e.spd, dt);
    }
    e.x += e.vx * dt * sf; e.y += e.vy * dt * sf;
    if (e.x < 10) e.x = 10; else if (e.x > ARENA_W - 10) e.x = ARENA_W - 10;
    if (e.y < 10) e.y = 10; else if (e.y > ARENA_H - 10) e.y = ARENA_H - 10;
    // Kontakt mit Spieler
    if (d < e.r + PR && e.def.ai !== 'gold') {
      if (p.dashT > 0 && !e.boss) { damageEnemy(w, e, w.stats.tailDmg * 2, 2, true); if (!e.on) continue; }
      else if (hurtPlayer(w, e.dmg, e.x, e.y)) {
        if (w.stats.flags.thorns) damageEnemy(w, e, w.stats.loopDmg * 1.5 + e.maxHp * 0.15 * (e.boss ? 0 : 1), 2, false);
        if (def.ai === 'kamikaze' && e.on) { emit(w, EV.EXPLODE, e.x, e.y, 50); e.on = false; w.alive--; continue; }
        if (!e.on) continue;
        if (!e.boss) { e.vx -= dx / d * 200; e.vy -= dy / d * 200; }
      }
    }
    // Schweif-Kontakt (10 Hz)
    if (tailTick && w.tLen > 3) {
      const rr = (e.r + 7) ** 2;
      for (let k = 0; k < w.tLen - 2; k += 1) {
        const q = tailIdx(w, k);
        const ex = w.tx[q] - e.x, ey = w.ty[q] - e.y;
        if (ex * ex + ey * ey < rr) { damageEnemy(w, e, w.stats.tailDmg * 0.1, 2, true); break; }
      }
    }
  }
}

function bossAI(w, e, dt, dx, dy, d, sf) {
  const def = e.def, p = w.p, rng = w.rng;
  const enr = e.hp < e.maxHp * 0.5 ? 0.66 : 1;
  if (e.state === 2) { e.vx *= 0.9; e.vy *= 0.9; e.cd2 -= dt; if (e.cd2 <= 0) { e.state = 1; e.cd2 = 0.75; e.vx = Math.cos(e.ang) * e.spd * 6.5; e.vy = Math.sin(e.ang) * e.spd * 6.5; } }
  else if (e.state === 1) { e.cd2 -= dt; if (e.cd2 <= 0) e.state = 0; }
  else {
    const tv = d > 280 ? e.spd : d < 170 ? -e.spd * 0.6 : e.spd * 0.2;
    const f = Math.min(1, dt * 2);
    e.vx += ((dx / d) * tv - (dy / d) * e.spd * 0.4 - e.vx) * f; e.vy += ((dy / d) * tv + (dx / d) * e.spd * 0.4 - e.vy) * f;
  }
  if (sf === 0) return;
  for (let i = 0; i < def.patterns.length; i++) {
    e.pcd[i] -= dt;
    if (e.pcd[i] > 0) continue;
    const pt = def.patterns[i];
    e.pcd[i] = pt.cd * enr * (0.85 + rng() * 0.3);
    switch (pt.type) {
      case 'ring': { const o = rng() * 6.283; const n = Math.round(pt.n * (enr < 1 ? 1.3 : 1)); for (let k = 0; k < n; k++) fireBullet(w, e.x, e.y, o + k / n * 6.283, 165, e.dmg * 0.6); emit(w, EV.SHOOT, e.x, e.y, 2); break; }
      case 'aimed': { const a = Math.atan2(dy, dx); for (let k = 0; k < pt.n; k++) fireBullet(w, e.x, e.y, a + (k - (pt.n - 1) / 2) * 0.17, 270, e.dmg * 0.6); emit(w, EV.SHOOT, e.x, e.y, 2); break; }
      case 'spiral': e.spiralT = pt.dur; break;
      case 'charge': e.state = 2; e.cd2 = 0.7; e.ang = Math.atan2(dy, dx); emit(w, EV.TELE, e.x, e.y, 1, e.ang); break;
      case 'summon': { const sd = w.data.enemyMap[pt.enemy]; for (let k = 0; k < pt.n; k++) { const a = k / pt.n * 6.283; spawnEnemy(w, sd, e.x + Math.cos(a) * (e.r + 30), e.y + Math.sin(a) * (e.r + 30), false); } break; }
      case 'nova': addHazard(w, p.x + p.vx * 0.5, p.y + p.vy * 0.5, 130, 1.15, e.dmg * 1.2, 0, 1); break;
      case 'pull': e.pullT = pt.dur; break;
      case 'blink': { emit(w, EV.TELE, e.x, e.y); const a = rng() * 6.283; e.x = Math.max(80, Math.min(ARENA_W - 80, p.x + Math.cos(a) * 300)); e.y = Math.max(80, Math.min(ARENA_H - 80, p.y + Math.sin(a) * 300)); emit(w, EV.TELE, e.x, e.y); const o = rng() * 6.283; for (let k = 0; k < 10; k++) fireBullet(w, e.x, e.y, o + k * 0.628, 150, e.dmg * 0.5); break; }
    }
  }
  if (e.spiralT > 0) {
    e.spiralT -= dt; e.scd -= dt;
    if (e.scd <= 0) { e.scd = 0.085; e.sang += 0.37; fireBullet(w, e.x, e.y, e.sang, 180, e.dmg * 0.5); fireBullet(w, e.x, e.y, e.sang + 3.1416, 180, e.dmg * 0.5); }
  }
  if (e.pullT > 0) { e.pullT -= dt; p.pullX += -dx / d * 170; p.pullY += -dy / d * 170; }
}

function addHazard(w, x, y, r, t, dmg, edmg, kind) {
  for (let i = 0; i < w.haz.length; i++) {
    const h = w.haz[i];
    if (h.on) continue;
    h.on = true; h.x = x; h.y = y; h.r = r; h.t = t; h.max = t; h.dmg = dmg; h.edmg = edmg; h.kind = kind;
    return h;
  }
  return null;
}

function updateHazards(w, dt) {
  for (let i = 0; i < w.haz.length; i++) {
    const h = w.haz[i];
    if (!h.on) continue;
    h.t -= dt;
    if (h.t > 0) continue;
    h.on = false;
    emit(w, EV.EXPLODE, h.x, h.y, h.r);
    const p = w.p;
    if ((p.x - h.x) ** 2 + (p.y - h.y) ** 2 < (h.r + PR) ** 2) hurtPlayer(w, h.dmg, h.x, h.y);
    if (h.edmg > 0) {
      for (let k = 0; k < w.enemies.length; k++) {
        const e = w.enemies[k];
        if (e.on && (e.x - h.x) ** 2 + (e.y - h.y) ** 2 < (h.r + e.r) ** 2) damageEnemy(w, e, h.edmg, 5, false);
      }
    }
  }
}

// ---------- Projektile & Pickups ----------
function updateProjectiles(w, dt) {
  const p = w.p, st = w.stats;
  for (let i = 0; i < w.bullets.length; i++) {
    const b = w.bullets[i];
    if (!b.on) continue;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -50 || b.y < -50 || b.x > ARENA_W + 50 || b.y > ARENA_H + 50) { b.on = false; continue; }
    if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (b.r + PR - 3) ** 2) { if (hurtPlayer(w, b.dmg, b.x, b.y)) b.on = false; }
  }
  // Auto-Funken
  if (st.sparkRate > 0) {
    w.sparkAcc += st.sparkRate * dt;
    while (w.sparkAcc >= 1) {
      w.sparkAcc -= 1;
      let best = null, bd = 520 * 520;
      for (let k = 0; k < w.enemies.length; k++) {
        const e = w.enemies[k];
        if (!e.on) continue;
        const dd = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
        if (dd < bd) { bd = dd; best = e; }
      }
      if (best) { fireSpark(w, p.x, p.y, Math.atan2(best.y - p.y, best.x - p.x) + (w.rng() - 0.5) * 0.15, st.sparkDmg); emit(w, EV.SHOOT, p.x, p.y, 3); }
    }
  }
  for (let i = 0; i < w.sparks.length; i++) {
    const s = w.sparks[i];
    if (!s.on) continue;
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { s.on = false; continue; }
    for (let k = 0; k < w.enemies.length; k++) {
      const e = w.enemies[k];
      if (!e.on) continue;
      if ((e.x - s.x) ** 2 + (e.y - s.y) ** 2 < (e.r + 5) ** 2) {
        damageEnemy(w, e, s.dmg, 4, true);
        s.hits++;
        if (!s.pierce || s.hits >= 4) { s.on = false; break; }
      }
    }
  }
}

function gainXp(w, v) {
  const g = v * w.stats.xpMult;
  w.xp += g; w.c.xpTotal += g;
}

function updatePicks(w, dt) {
  const p = w.p, st = w.stats, m2 = st.magnet * st.magnet;
  const all = w.bossDeadT > 0;
  for (let i = 0; i < w.picks.length; i++) {
    const q = w.picks[i];
    if (!q.on) continue;
    q.t += dt;
    const dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
    if (!q.mag && (d2 < m2 || all)) q.mag = true;
    if (q.mag) {
      const d = Math.sqrt(d2) || 1, s = 260 + q.t * 120 + (all ? 600 : 0);
      q.vx += (dx / d * s * 2.2 - q.vx) * Math.min(1, dt * 8); q.vy += (dy / d * s * 2.2 - q.vy) * Math.min(1, dt * 8);
    } else { q.vx *= 1 - Math.min(1, dt * 3); q.vy *= 1 - Math.min(1, dt * 3); }
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (d2 < 22 * 22) {
      q.on = false;
      switch (q.kind) {

          ctx.closePath(); ctx.globalAlpha = 0.38; ctx.fill(); ctx.stroke(); break;
        }
        case 'bubbles': ctx.strokeStyle = o.k < 0.5 ? pal.accent : pal.star; ctx.globalAlpha = 0.14; ctx.beginPath(); ctx.arc(o.x, o.y + Math.sin(t + o.a) * 12, o.r * (0.9 + Math.sin(t * 1.3 + o.a) * 0.1), 0, TAU); ctx.stroke(); break;
        case 'crystals': {
          ctx.strokeStyle = pal.accent; ctx.globalAlpha = 0.18 + Math.sin(t * 2 + o.a) * 0.08; ctx.beginPath();
          const c = Math.cos(o.a), s = Math.sin(o.a);
          ctx.moveTo(o.x + c * o.r, o.y + s * o.r); ctx.lineTo(o.x - s * o.r * 0.25, o.y + c * o.r * 0.25); ctx.lineTo(o.x - c * o.r, o.y - s * o.r); ctx.lineTo(o.x + s * o.r * 0.25, o.y - c * o.r * 0.25); ctx.closePath(); ctx.stroke(); break;
        }
        case 'embers': { const yy = o.y - ((t * 30 * (0.5 + o.k)) % 200); ctx.fillStyle = o.k < 0.5 ? pal.accent : pal.star; ctx.globalAlpha = 0.35 * (1 - ((t * 30 * (0.5 + o.k)) % 200) / 200); ctx.fillRect(o.x, yy, 3, 3); break; }
        case 'prisms': {
          ctx.strokeStyle = o.k < 0.5 ? pal.accent : pal.star; ctx.globalAlpha = 0.2; ctx.beginPath();
          for (let i = 0; i < 3; i++) { const a = o.a + t * o.v + i / 3 * TAU; ctx.lineTo(o.x + Math.cos(a) * o.r, o.y + Math.sin(a) * o.r); }
          ctx.closePath(); ctx.stroke(); break;
        }
        case 'void': { const ph = (t * 0.3 + o.k) % 1; ctx.strokeStyle = pal.accent; ctx.globalAlpha = 0.16 * (1 - ph); ctx.beginPath(); ctx.arc(o.x, o.y, o.r * ph * 1.6, 0, TAU); ctx.stroke(); break; }
      }
    }
    ctx.globalAlpha = 1;
  }

  function shapePath(sh, x, y, r, ang) {
    ctx.beginPath();
    if (sh === 'circle' || sh === 'eye' || sh === 'ring') { ctx.arc(x, y, r, 0, TAU); return; }
    const p = SHAPES[sh] || SHAPES.hex, c = Math.cos(ang), s = Math.sin(ang);
    for (let i = 0; i < p.length; i += 2) { const px = p[i] * r, py = p[i + 1] * r; ctx.lineTo(x + px * c - py * s, y + px * s + py * c); }
    ctx.closePath();
  }

  function drawEnemies(w, v) {
    const [x0, x1, y0, y1] = v;
    for (let i = 0; i < w.enemies.length; i++) {
      const e = w.enemies[i];
      if (!e.on || e.x < x0 - 80 || e.x > x1 + 80 || e.y < y0 - 80 || e.y > y1 + 80) continue;
      const def = e.def, sh = def.shape, col = def.color;
      const ang = sh === 'tri' || sh === 'diamond' ? Math.atan2(e.vy, e.vx) + Math.PI / 2 : e.t * 0.8 + e.ang;
      ctx.globalAlpha = e.alpha;
      if (e.boss) {
        const pulse = 1 + Math.sin(R.t * 4) * 0.04;
        ctx.globalCompositeOperation = 'lighter';
        const g = glow(col, 64); ctx.drawImage(g, e.x - e.r * 2, e.y - e.r * 2, e.r * 4, e.r * 4);
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = col; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.35, R.t, R.t + 4.5); ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.6, -R.t * 0.7, -R.t * 0.7 + 2.5); ctx.stroke();
        if (e.state === 2) { ctx.strokeStyle = '#ff3050'; ctx.globalAlpha = 0.5 + Math.sin(R.t * 30) * 0.3; ctx.lineWidth = e.r; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.ang) * 700, e.y + Math.sin(e.ang) * 700); ctx.stroke(); ctx.globalAlpha = 1; }
        shapePath(sh, e.x, e.y, e.r * pulse, R.t * 0.4);
        ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#0b0612'; ctx.fill();
        ctx.lineWidth = 5; ctx.strokeStyle = col; ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.32 * pulse, 0, TAU); ctx.fill();
        continue;
      }
      // Telegraphs
      if (def.ai === 'sniper' && e.state === 1) { ctx.strokeStyle = '#ff3050'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4 + (1 - e.cd2) * 0.5; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.ang) * 900, e.y + Math.sin(e.ang) * 900); ctx.stroke(); ctx.globalAlpha = e.alpha; }
      if (def.ai === 'dart' && e.state === 1) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.ang) * 200, e.y + Math.sin(e.ang) * 200); ctx.stroke(); ctx.globalAlpha = e.alpha; }
      if (def.ai === 'mine' && e.state === 1) { ctx.strokeStyle = '#ff3050'; ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, 120, 0, TAU); ctx.stroke(); ctx.globalAlpha = e.alpha; }
      if (def.ai === 'magnet') { ctx.strokeStyle = col; ctx.globalAlpha = 0.12; ctx.lineWidth = 2; const ph = (R.t * 0.8) % 1; ctx.beginPath(); ctx.arc(e.x, e.y, 430 * (1 - ph), 0, TAU); ctx.stroke(); ctx.globalAlpha = e.alpha; }
      if (e.elite) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7, R.t * 3, R.t * 3 + 4.2); ctx.stroke(); }
      shapePath(sh, e.x, e.y, e.r, ang);
      const frozen = e.freezeT > 0;
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : frozen ? '#cfefff' : col;
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = e.burnT > 0 ? '#ff6a3d' : 'rgba(0,0,0,0.45)'; ctx.stroke();
      if (sh === 'eye') { ctx.fillStyle = '#1a0420'; ctx.beginPath(); ctx.arc(e.x + Math.cos(ang) * 3, e.y + Math.sin(ang) * 3, e.r * 0.45, 0, TAU); ctx.fill(); }
      if (sh === 'ring') { ctx.fillStyle = '#120a24'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.5, 0, TAU); ctx.fill(); }
      if (e.elite || (e.hp < e.maxHp && e.maxHp > 40 * w.diff)) {
        const bw = e.r * 2; ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 12, bw, 4);
        ctx.fillStyle = e.elite ? '#ffd700' : col; ctx.fillRect(e.x - bw / 2, e.y - e.r - 12, bw * Math.max(0, e.hp / e.maxHp), 4);
      }
    }
    ctx.globalAlpha = 1;
  }

  const _tp = [0, 0];
  function drawTail(w) {
    const n = w.tLen, col = w.stats.color;
    if (n < 2) return;
    const net = w.p.netT > 0;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'lighter';
    const seg = 4;
    for (let s = 0; s < seg; s++) {
      const a = Math.floor(s * (n - 1) / seg), b = Math.floor((s + 1) * (n - 1) / seg);
      ctx.beginPath();
      for (let i = a; i <= b; i++) { const q = (w.tStart + i) % 512; if (i === a) ctx.moveTo(w.tx[q], w.ty[q]); else ctx.lineTo(w.tx[q], w.ty[q]); }
      const f = (s + 1) / seg;
      ctx.strokeStyle = net ? '#e6d0ff' : col; ctx.globalAlpha = 0.16 * f; ctx.lineWidth = (net ? 18 : 14) * (0.5 + f * 0.5); ctx.stroke();
      ctx.globalAlpha = 0.85 * f; ctx.lineWidth = 3 * (0.5 + f * 0.6); ctx.stroke();
    }
    ctx.lineTo(w.p.x, w.p.y); ctx.stroke();
    // Schliess-Hinweis: Punkt auf dem Schweif, der nah am Kopf ist
    let best = -1, bd = 46 * 46;
    for (let i = 0; i < n - 10; i += 2) { const q = (w.tStart + i) % 512; const d = (w.tx[q] - w.p.x) ** 2 + (w.ty[q] - w.p.y) ** 2; if (d < bd) { bd = d; best = q; } }
    if (best >= 0) {
      ctx.globalAlpha = 0.6 + Math.sin(R.t * 20) * 0.3; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(w.tx[best], w.ty[best], 9 + Math.sin(R.t * 20) * 2, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function drawFlashes(w) {
    for (const f of w.flashes) {
      if (f.t <= 0 || f.n < 3) continue;
      const a = f.t / 0.6;
      ctx.beginPath();
      for (let i = 0; i < f.n; i++) ctx.lineTo(f.pts[i * 2], f.pts[i * 2 + 1]);
      ctx.closePath();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = f.net ? '#cfa6ff' : w.stats.color; ctx.globalAlpha = 0.3 * a * a; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.9 * a; ctx.lineWidth = 3 + (1 - a) * 6; ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer(w) {
    const p = w.p, col = w.stats.color;
    if (p.inv > 0 && p.dashT <= 0 && Math.floor(R.t * 20) % 2 === 0 && !w.over) return;
    ctx.globalCompositeOperation = 'lighter';
    const g = glow(col, 48); const s = p.dashT > 0 ? 90 : 64;
    ctx.drawImage(g, p.x - s / 2, p.y - s / 2, s, s);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(p.x + p.dirX * 16, p.y + p.dirY * 16); ctx.lineTo(p.x - p.dirY * 6, p.y + p.dirX * 6); ctx.lineTo(p.x + p.dirY * 6, p.y - p.dirX * 6); ctx.fill();
    if (p.netT > 0) { ctx.strokeStyle = '#cfa6ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 20 + Math.sin(R.t * 12) * 3, 0, TAU); ctx.stroke(); }
  }

  function drawPicks(w, v) {
    const [x0, x1, y0, y1] = v, pal = w.zone.pal;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < w.picks.length; i++) {
      const q = w.picks[i];
      if (!q.on || q.x < x0 || q.x > x1 || q.y < y0 || q.y > y1) continue;
      switch (q.kind) {
        case PICK.XP: ctx.fillStyle = '#8fffc8'; ctx.fillRect(q.x - 3, q.y - 3, 6, 6); break;
        case PICK.DUST: ctx.fillStyle = pal.star; ctx.beginPath(); ctx.arc(q.x, q.y, 3.5, 0, TAU); ctx.fill(); break;
        case PICK.GOLD: { const g = glow('#ffd700', 24); ctx.drawImage(g, q.x - 12, q.y - 12, 24, 24); ctx.fillStyle = '#fff6b0'; ctx.fillRect(q.x - 3, q.y - 3, 6, 6); break; }
        case PICK.HEART: ctx.fillStyle = '#ff4d6d'; ctx.fillRect(q.x - 7, q.y - 2.5, 14, 5); ctx.fillRect(q.x - 2.5, q.y - 7, 5, 14); break;
        case PICK.CHEST: { const g = glow('#ffd700', 40); const b = 1 + Math.sin(R.t * 6) * 0.1; ctx.drawImage(g, q.x - 30 * b, q.y - 30 * b, 60 * b, 60 * b); ctx.fillStyle = '#ffd700'; ctx.fillRect(q.x - 9, q.y - 7, 18, 14); ctx.fillStyle = '#7a4a00'; ctx.fillRect(q.x - 9, q.y - 1, 18, 2); break; }
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawProjectiles(w, v) {
    const [x0, x1, y0, y1] = v;
    ctx.globalCompositeOperation = 'lighter';
    const gb = glow('#ff3a6e', 20);
    for (let i = 0; i < w.bullets.length; i++) {
      const b = w.bullets[i];
      if (!b.on || b.x < x0 || b.x > x1 || b.y < y0 || b.y > y1) continue;
      const s = b.big ? 34 : 22; ctx.drawImage(gb, b.x - s / 2, b.y - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffe0ea';
    for (let i = 0; i < w.bullets.length; i++) { const b = w.bullets[i]; if (!b.on || b.x < x0 || b.x > x1 || b.y < y0 || b.y > y1) continue; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#ffd66b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < w.sparks.length; i++) { const s = w.sparks[i]; if (!s.on) continue; ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.025, s.y - s.vy * 0.025); }
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    // Gefahrenzonen
    for (let i = 0; i < w.haz.length; i++) {
      const h = w.haz[i];
      if (!h.on) continue;
      const f = 1 - h.t / h.max;
      ctx.fillStyle = h.kind === 2 ? '#ffab40' : '#ff3050'; ctx.globalAlpha = 0.12 + f * 0.25;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r * f, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.7; ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFx(fx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of fx.parts) {
      if (!p.on) continue;
      ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color;
      const s = p.size * (0.5 + 0.5 * p.life / p.max); ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    for (const g of fx.rings) {
      if (!g.on) continue;
      const f = 1 - g.life / g.max, e = 1 - (1 - f) * (1 - f);
      ctx.globalAlpha = (1 - f) * 0.9; ctx.strokeStyle = g.color; ctx.lineWidth = g.w * (1 - f) + 1;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r + (g.r2 - g.r) * e, 0, TAU); ctx.stroke();
    }
    for (const l of fx.lines) {
      if (!l.on) continue;
      ctx.globalAlpha = l.life / l.max; ctx.strokeStyle = l.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(l.x, l.y);
      const mx = (l.x + l.x2) / 2 + (Math.random() - 0.5) * 30, my = (l.y + l.y2) / 2 + (Math.random() - 0.5) * 30;
      ctx.lineTo(mx, my); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of fx.texts) {
      if (!t.on) continue;
      const f = 1 - t.life / t.max, pop = f < 0.15 ? 0.6 + f / 0.15 * 0.6 : 1.2 - Math.min(0.2, (f - 0.15));
      ctx.globalAlpha = Math.min(1, t.life / t.max * 2.5);
      ctx.font = `800 ${Math.round(t.size * pop)}px ${FONT}`;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------------- HUD ----------------
  function bar(x, y, w, h, f, col, bg = 'rgba(0,0,0,0.5)') {
    ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, f)), h);
  }
  function txt(s, x, y, size, col = '#fff', align = 'left', weight = 700) {
    ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = col; ctx.fillText(s, x, y);
  }
  const fmtT = (t) => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  R.fmtT = fmtT;

  function drawHud(w, fx, inp, hud) {
    const d = R.dpr, W = R.W, H = R.H, L = R.layout, st = w.stats, p = w.p, pal = w.zone.pal;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    // Vignette bei wenig LP
    const low = p.hp / st.maxHp;
    if (low < 0.35 || fx.hurtT > 0) { ctx.globalAlpha = Math.max(fx.hurtT * 1.5, (0.35 - low) * 2.2 * (0.8 + Math.sin(R.t * 6) * 0.2)); ctx.drawImage(R.vignette, 0, 0, W, H); ctx.globalAlpha = 1; }
    if (fx.flash > 0) { ctx.globalAlpha = Math.min(0.5, fx.flash * 0.35); ctx.fillStyle = fx.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    const bw = Math.min(210, W * 0.34);
    // LP
    bar(14, 14, bw, 13, p.hp / st.maxHp, low < 0.3 ? '#ff4060' : '#7dff8a');
    txt(Math.ceil(Math.max(0, p.hp)) + ' / ' + Math.round(st.maxHp), 20, 21, 10, '#0b1a0e', 'left', 800);
    bar(14, 30, bw, 5, w.xp / w.xpNext, '#8fffc8');
    txt('Stufe ' + w.lvl, 14 + bw, 44, 10, '#8fffc8', 'right', 800);
    // Ziele
    if (hud.goals) {
      let y = 60;
      for (const g of hud.goals) {
        const f = Math.min(1, g.cur / g.target), done = f >= 1;
        ctx.globalAlpha = 0.85;
        txt((done ? '✓ ' : '') + g.label, 14, y, 10.5, done ? '#7dff8a' : g.kind === 'main' ? '#ffe9a8' : '#d8d8f0', 'left', 600);
        bar(14, y + 8, Math.min(150, bw * 0.75), 3, f, done ? '#7dff8a' : pal.accent);
        txt(Math.floor(Math.min(g.cur, g.target)) + '/' + g.target, 14 + Math.min(150, bw * 0.75) + 6, y + 9, 9, '#aab', 'left', 600);
        y += 24;
      }
      ctx.globalAlpha = 1;
    }
    // Timer / Boss
    const cx = W / 2;
    if (w.boss) {
      const b = w.boss, bbw = Math.min(420, W * 0.56);
      txt(b.def.name, cx, 18, 13, pal.accent, 'center', 800);
      bar(cx - bbw / 2, 28, bbw, 9, b.hp / b.maxHp, w.coreBreak && Math.floor(R.t * 6) % 2 ? '#ff7ff0' : pal.accent);
    } else if (w.overdrive) {
      txt('OVERDRIVE ' + fmtT(w.odEnd - w.t), cx, 20, 16, '#ff4d6d', 'center', 900);
      txt('Doppelte Beute – Tod kostet die Hälfte', cx, 38, 10, '#ffb0c0', 'center', 600);
    } else if (!w.bossDone) {
      txt(fmtT(w.t), cx, 20, 18, '#fff', 'center', 800);
      const left = w.bossAt - w.t;
      txt('Boss in ' + fmtT(left), cx, 40, 11, left < 15 ? '#ff6a6a' : '#bbc', 'center', 600);
    }
    if (w.frenzyT > 0) txt('RASEREI ' + Math.ceil(w.frenzyT) + 's', cx, 58, 11, '#ffd700', 'center', 800);
    // Staub + Pause
    const P = L.pause;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(P.x, P.y, P.w, P.h);
    ctx.fillStyle = '#fff'; ctx.fillRect(P.x + 14, P.y + 12, 5, 18); ctx.fillRect(P.x + 23, P.y + 12, 5, 18);
    txt('✦ ' + Math.floor(w.dust).toLocaleString('de-CH'), P.x - 10, 22, 15, pal.star, 'right', 800);
    if (w.c.chests > 0) txt('▣ ' + w.c.chests, P.x - 10, 42, 12, '#ffd700', 'right', 800);
    // Combo
    if (w.combo >= 5) {
      const s = 1 + Math.max(0, fx.comboPulse) * 0.25;
      ctx.save(); ctx.translate(W - 70, H * 0.36); ctx.scale(s, s);
      txt('×' + w.combo, 0, 0, 30, w.combo >= 100 ? '#ff4d6d' : w.combo >= 40 ? '#ffd700' : '#fff', 'center', 900);
      txt('COMBO', 0, 22, 10, '#bbc', 'center', 700);
      ctx.restore();
      bar(W - 100, H * 0.36 + 34, 60, 3, w.comboT / 3, '#fff');
    }
    // Fang-Text
    if (fx.catchText) {
      const c = fx.catchText, f = 1 - c.t / c.max, sc = f < 0.12 ? 0.5 + f / 0.12 * 0.8 : 1.3 - Math.min(0.3, f * 0.4);
      ctx.save(); ctx.globalAlpha = Math.min(1, c.t * 3); ctx.translate(cx, H * 0.3); ctx.scale(sc, sc);
      const big = c.n >= 15, col = c.n >= 25 ? '#ff4d6d' : big ? '#ffd700' : '#fff';
      ctx.font = `900 ${big ? 40 : 30}px ${FONT}`; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      const label = c.n + (c.n >= 25 ? ' – UNFASSBAR!' : c.n >= 15 ? ' – RIESENFANG!' : c.n >= 8 ? ' – STARK!' : ' GEFANGEN');
      ctx.strokeText(label, 0, 0); ctx.fillStyle = col; ctx.fillText(label, 0, 0);
      ctx.restore();
    }
    // Banner
    if (fx.banner) {
      const b = fx.banner, f = 1 - b.t / b.max, a = Math.min(1, f * 6, b.t * 2.5);
      ctx.globalAlpha = a;
      const sl = (1 - Math.min(1, f * 5)) * 40;
